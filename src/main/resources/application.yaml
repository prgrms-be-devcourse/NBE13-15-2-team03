spring:
  application:
    name: reservation
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  mvc:
    format:
      date: iso
      date-time: iso
kdt:
  jwt:
    secret: ${JWT_SECRET}
    access-seconds: 1800       # 30분
    refresh-seconds: 1209600   # 14일
  