spring:
  application:
    name: reservation
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

jwt:
  access-expiration-ms: 1800000       # 30분
  refresh-expiration-ms: 1209600000   # 14일